<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>soc-log-triage</title>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #ffffff;
    --border: #e3e2de;
    --border-strong: #d0cfca;
    --text: #21201c;
    --dim: #6b6a65;
    --faint: #97968f;
    --accent: #8a5a1a;
    --crit: #a33427;
    --crit-bg: #fdf1ef;
    --warn: #8a5a1a;
    --warn-bg: #fdf6ea;
    --ok: #2b6a44;
    --ok-bg: #eef6f0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1d1e23;
      --border: #2c2d33;
      --border-strong: #3a3b42;
      --text: #e6e5e1;
      --dim: #9b9a94;
      --faint: #6e6d68;
      --accent: #d5a253;
      --crit: #e08272;
      --crit-bg: #2a1d1b;
      --warn: #d5a253;
      --warn-bg: #2a2318;
      --ok: #6cbb8b;
      --ok-bg: #1a2620;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header { margin-bottom: 1.75rem; }
  h1 {
    font-size: 1.15rem; font-weight: 600; margin: 0 0 .3rem;
    letter-spacing: -.01em;
  }
  header p { margin: 0; color: var(--dim); font-size: .9rem; }

  /* --- composer --- */
  .composer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: .85rem .95rem .7rem;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer.drag { border-color: var(--accent); background: var(--warn-bg); }

  textarea {
    width: 100%; border: 0; outline: 0; resize: vertical;
    background: transparent; color: var(--text);
    font: inherit; min-height: 96px; padding: 0;
  }
  textarea::placeholder { color: var(--faint); }

  .bar {
    display: flex; align-items: center; gap: .6rem;
    margin-top: .7rem; padding-top: .7rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .file-btn {
    font-size: .82rem; color: var(--dim); cursor: pointer;
    padding: .3rem .55rem; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
  }
  .file-btn:hover { border-color: var(--border-strong); color: var(--text); }
  #fileInput { display: none; }
  .filename {
    font-family: var(--mono); font-size: .78rem; color: var(--accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 220px;
  }
  .spacer { flex: 1; }

  .toggle {
    display: flex; align-items: center; gap: .4rem;
    font-size: .82rem; color: var(--dim); cursor: pointer; user-select: none;
  }
  .toggle input { accent-color: var(--accent); cursor: pointer; }

  /* Bilgi baloncuğu — normalde yalnızca ⓘ görünür, açıklama hover/focus
     ile açılır. Kalıcı bir açıklama metni her seferinde yer kaplar ve
     çoğu kullanımda gereksizdir. */
  .info {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; flex-shrink: 0;
    border: 1px solid var(--border-strong); border-radius: 50%;
    color: var(--faint); font-size: .68rem; font-style: italic;
    font-family: Georgia, serif; cursor: help; background: transparent;
    padding: 0; line-height: 1;
  }
  .info:hover, .info:focus-visible { color: var(--accent); border-color: var(--accent); }
  .info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Aşağı açılıyor, yukarı değil: composer sayfanın üstünde duruyor ve
     yukarı açılan bir baloncuk viewport'un dışına taşıp ilk satırları
     okunmaz hale getiriyordu. */
  .info .bubble {
    position: absolute; top: calc(100% + 8px); right: -6px;
    width: 290px; padding: .7rem .85rem;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
    font-size: .78rem; line-height: 1.5; font-style: normal;
    font-family: inherit; text-align: left;
    opacity: 0; visibility: hidden; transform: translateY(-3px);
    transition: opacity .13s, transform .13s, visibility .13s;
    z-index: 20; pointer-events: none;
  }
  .info:hover .bubble, .info:focus-visible .bubble {
    opacity: 1; visibility: visible; transform: translateY(0);
  }
  /* Dar ekranda sağa taşmasın — sağ kenara sabitlemek yerine composer'ın
     içinde kalacak şekilde daraltılıyor. */
  @media (max-width: 420px) {
    .info .bubble { width: min(290px, 78vw); }
  }
  .info .bubble strong { color: var(--text); font-weight: 600; }
  .info .bubble p { margin: 0 0 .5rem; }
  .info .bubble p:last-child { margin: 0; }
  @media (prefers-reduced-motion: reduce) {
    .info .bubble { transition: none; }
  }

  button.send {
    background: var(--text); color: var(--bg);
    border: 0; border-radius: 7px;
    padding: .45rem 1.05rem; font-size: .87rem; font-weight: 550;
    cursor: pointer;
  }
  button.send:disabled { opacity: .45; cursor: default; }

  .hint { margin-top: .55rem; font-size: .78rem; color: var(--faint); }

  /* --- results --- */
  #out { margin-top: 1.5rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.15rem;
    margin-bottom: .9rem;
  }
  .card-label {
    font-family: var(--mono); font-size: .7rem; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint); margin-bottom: .5rem;
  }

  .verdict-row { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
  .pill {
    font-size: .84rem; font-weight: 620;
    padding: .3rem .75rem; border-radius: 20px;
  }
  .pill.phishing { color: var(--crit); background: var(--crit-bg); }
  .pill.muhtemel { color: var(--warn); background: var(--warn-bg); }
  .pill.guvenilir { color: var(--ok); background: var(--ok-bg); }
  .pill.reject { color: var(--dim); background: var(--bg); border: 1px solid var(--border); }
  .score { font-family: var(--mono); font-size: .82rem; color: var(--dim); }

  ul.signals { list-style: none; padding: 0; margin: .85rem 0 0; }
  ul.signals li {
    display: flex; gap: .7rem; padding: .3rem 0;
    font-size: .87rem; border-top: 1px solid var(--border);
  }
  ul.signals li:first-child { border-top: 0; }
  .w {
    font-family: var(--mono); font-size: .8rem; font-weight: 600;
    min-width: 2.2rem; text-align: right; color: var(--crit);
  }
  .w.neg { color: var(--ok); }
  .sig-desc { color: var(--dim); }
  .none { color: var(--faint); font-style: italic; font-size: .87rem; }

  .route-line { font-size: .87rem; color: var(--dim); }
  .route-line code {
    font-family: var(--mono); font-size: .82em;
    background: var(--bg); border: 1px solid var(--border);
    padding: .05em .35em; border-radius: 4px; color: var(--accent);
  }

  .err {
    font-size: .85rem; color: var(--crit);
    background: var(--crit-bg); border-radius: 8px;
    padding: .6rem .8rem; margin-top: .75rem;
  }

  iframe {
    width: 100%; border: 1px solid var(--border);
    border-radius: 10px; background: #fff;
    height: 620px; display: block;
  }
  .iframe-note {
    font-size: .76rem; color: var(--faint); margin-top: .5rem;
  }
  .iframe-note a { color: var(--accent); }

  .status {
    display: flex; align-items: center; gap: .6rem;
    color: var(--dim); font-size: .88rem; padding: 1rem 0;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none } }

  .meta { font-size: .78rem; color: var(--faint); margin-top: .5rem; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>soc-log-triage</h1>
    <p>E-postayı yapıştır ya da <code>.eml</code> dosyasını sürükle.</p>
  </header>

  <form id="form">
    <div class="composer" id="composer">
      <textarea id="text" placeholder="Ham e-postayı buraya yapıştır (header'larıyla birlikte)…"></textarea>
      <div class="bar">
        <label class="file-btn" for="fileInput">Dosya seç</label>
        <input type="file" id="fileInput" accept=".eml,.msg,.txt">
        <span class="filename" id="filename"></span>
        <span class="spacer"></span>
        <label class="toggle">
          <input type="checkbox" id="llm">
          LLM ile yaz <span style="color:var(--faint)">(~100 sn)</span>
        </label>
        <label class="toggle" id="constrainWrap" hidden>
          <input type="checkbox" id="constrain">
          Şema kısıtı
          <span class="info" tabindex="0" role="button" aria-label="Şema kısıtı nedir">i
            <span class="bubble" role="tooltip">
              <p><strong>Varsayılan kapalı — modelin gerçek davranışı bu.</strong>
              Projenin ölçümleri (şema uyumu, groundedness) kısıtsız modda
              yapıldı; demo da aynı koşulda çalışsın diye.</p>
              <p>Açıldığında modelin ürettiği her token, rapor şemasının izin
              verdiği alfabeyle sınırlanır — bozuk JSON üretmek yapısal olarak
              imkânsız hale gelir.</p>
              <p>Bir mailde üç deneme üst üste aynı hatayla başarısız olmuştu:
              metnin içinde kaçışsız çift tırnak. Prompt'a kural yazmak
              çözmedi, çünkü model "şu an bir JSON metninin içindeyim"
              durumunu takip etmiyor. Kısıt bunu modelin dışında takip eder.</p>
            </span>
          </span>
        </label>
        <button class="send" id="send" type="submit">Analiz et</button>
      </div>
    </div>
    <div class="hint">
      Karar her iki modda da kural motorundan gelir. LLM yalnızca raporun
      metnini yazar — sınıflandırma yapmaz.
    </div>
  </form>

  <div id="out"></div>
</div>

<script>
const form = document.getElementById('form');
const textEl = document.getElementById('text');
const fileInput = document.getElementById('fileInput');
const filenameEl = document.getElementById('filename');
const composer = document.getElementById('composer');
const sendBtn = document.getElementById('send');
const llmEl = document.getElementById('llm');
const constrainEl = document.getElementById('constrain');
const constrainWrap = document.getElementById('constrainWrap');
const out = document.getElementById('out');

// Şema kısıtı yalnızca LLM modunda anlamlı — mekanik raporda üretilen bir
// metin yok. Hızlı moddayken gizli tutmak, kapalı ama görünür bir kutunun
// yarattığı "bu neden çalışmıyor" sorusunu ortadan kaldırıyor.
const syncConstrain = () => { constrainWrap.hidden = !llmEl.checked; };
llmEl.addEventListener('change', syncConstrain);
syncConstrain();

let picked = null;

function setFile(f) {
  picked = f;
  filenameEl.textContent = f ? f.name : '';
  if (f) textEl.value = '';
}

fileInput.addEventListener('change', e => setFile(e.target.files[0] || null));

['dragenter', 'dragover'].forEach(ev =>
  composer.addEventListener(ev, e => {
    e.preventDefault();
    composer.classList.add('drag');
  }));
['dragleave', 'drop'].forEach(ev =>
  composer.addEventListener(ev, e => {
    e.preventDefault();
    composer.classList.remove('drag');
  }));
composer.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) setFile(f);
});

// Cmd/Ctrl+Enter gönderir — uzun bir maili yapıştırdıktan sonra fareye
// gitmeden çalıştırmak için.
textEl.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') form.requestSubmit();
});

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pillClass = v =>
  v === 'Phishing' ? 'phishing' : v === 'Muhtemel Phishing' ? 'muhtemel' : 'guvenilir';

form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!picked && !textEl.value.trim()) return;

  const useLlm = llmEl.checked;
  sendBtn.disabled = true;
  out.innerHTML = `<div class="status"><span class="dot"></span>` +
    (useLlm ? 'Seneca raporu yazıyor — ilk çalıştırmada model yükleniyor, birkaç dakika sürebilir…'
            : 'Analiz ediliyor…') + `</div>`;

  const fd = new FormData();
  fd.append('mode', useLlm ? 'llm' : 'fast');
  if (useLlm && constrainEl.checked) fd.append('constrain', '1');
  if (picked) fd.append('file', picked);
  else fd.append('text', textEl.value);

  try {
    const res = await fetch('/analyze', { method: 'POST', body: fd });
    render(await res.json());
  } catch (err) {
    out.innerHTML = `<div class="card"><div class="err">İstek başarısız: ${esc(err.message)}</div></div>`;
  } finally {
    sendBtn.disabled = false;
  }
});

function render(d) {
  const r = d.routing || {};
  let html = `<div class="card">
    <div class="card-label">Yönlendirme</div>
    <div class="verdict-row">
      <span class="pill ${d.accepted ? 'guvenilir' : 'reject'}">
        ${d.accepted ? 'phishing hattı' : 'kabul edilmedi'}
      </span>
      <span class="score">kural: ${esc(r.rule || '—')}</span>
    </div>
    <div class="route-line" style="margin-top:.6rem">${esc(r.reason || '')}</div>
  </div>`;

  if (!d.accepted) { out.innerHTML = html; return; }

  if (d.error) {
    out.innerHTML = html + `<div class="card"><div class="err">${esc(d.error)}</div></div>`;
    return;
  }

  const sig = (d.signals || []).map(s =>
    `<li><span class="w ${s.weight < 0 ? 'neg' : ''}">${s.weight > 0 ? '+' : ''}${s.weight}</span>
     <span class="sig-desc">${esc(s.description)}</span></li>`).join('');

  html += `<div class="card">
    <div class="card-label">Kural motoru kararı</div>
    <div class="verdict-row">
      <span class="pill ${pillClass(d.verdict)}">${esc(d.verdict)}</span>
      <span class="score">skor ${d.score} · eşikler: ≥${d.thresholds.phishing} Phishing,
        ≥${d.thresholds.suspicious} Muhtemel</span>
    </div>
    ${sig ? `<ul class="signals">${sig}</ul>`
          : `<p class="none">Hiçbir sinyal tetiklenmedi.</p>`}
    <div class="meta">${d.mode === 'llm' ? 'LLM ile yazıldı' : 'Mekanik rapor'}${d.constrained ? ' · şema kısıtlı' : ''} ·
      ${d.elapsed} sn</div>
  </div>`;

  if (d.llm_error) {
    html += `<div class="card"><div class="err">
      <strong>LLM raporu üretilemedi</strong> — mekanik rapora düşüldü.<br>${esc(d.llm_error)}
    </div></div>`;
  }

  // srcdoc ile yazılıyor, contentDocument.write ile değil: sandbox=""
  // (script çalıştırmayı engellemek için gerekli) aynı zamanda
  // allow-same-origin'i de kaldırıyor, o olmadan contentDocument null
  // dönüyor ve "Cannot read properties of null" hatası çıkıyor.
  // srcdoc same-origin erişimi gerektirmiyor.
  html += `<div class="card">
    <div class="card-label">Rapor</div>
    <iframe id="rep" sandbox="" srcdoc="${esc(d.report_html)}"></iframe>
    <div class="iframe-note">
      Rapor sabit yükseklikte gösteriliyor —
      <a href="#" id="openTab">yeni sekmede aç</a>
    </div>
  </div>`;

  out.innerHTML = html;

  // Sandbox'lı iframe'in yüksekliği içeriğe göre ayarlanamıyor
  // (contentDocument erişimi allow-same-origin gerektiriyor, o da script
  // çalıştırmaya kapı açardı), o yüzden uzun raporlar için ayrı sekme.
  document.getElementById('openTab').addEventListener('click', e => {
    e.preventDefault();
    const blob = new Blob([d.report_html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  });
}
</script>
</body>
</html>
